# config/printer_lll_t2.cfg
# Paste into printer.cfg, or save as its own file and [include] it.
# Replace the serial path with your board's ID from: ls /dev/serial/by-id/

[mcu LLL_T2]
serial: /dev/serial/by-id/usb-Klipper_stm32f072xb_160038001457435938393920-if00
restart_method: command

# Runout: PB7 entrance switch, 1 = no filament (inverted with !)
[filament_switch_sensor lll_t2_runout]
switch_pin: ^!LLL_T2:PB7
pause_on_runout: False
runout_gcode:
    _LLL_FAULT TOOL=2 FAULT=0 FILAMENT=0

# Fault: PB14 summary fault, low = fault, high = healthy (no inversion)
[filament_switch_sensor lll_t2_fault]
switch_pin: ^LLL_T2:PB14
pause_on_runout: False
runout_gcode:
    _LLL_FAULT TOOL=2 FAULT=1 FILAMENT=1

# Auto-load settings, sent to the MCU at startup.
# auto_load: True feeds load_length mm after a stable insert, then the halls take over.
# load_speed is in mm/s; calibrate it with a timed 10 s KEY2 feed.
[lll_autoload T2]
mcu: LLL_T2
auto_load: True
load_length: 100
load_speed: 33.1

[gcode_macro _LLL_FAULT]
gcode:
    {% set tool = params.TOOL|int %}
    {% set fault = params.FAULT|int %}
    {% set filament = params.FILAMENT|int %}
    {% set tc = printer.toolchanger if printer.toolchanger is defined else none %}
    {% set active = tc.tool_number if (tc is not none and tc.tool_number is defined) else -1 %}
    {% set printing = printer.print_stats.state == "printing" %}
    {% if printing and active == -1 %}
        M118 LLL T{tool}: active tool unknown, buffer event ignored
    {% elif printing and active == tool %}
        {% if filament == 0 %}
            M118 LLL T{tool}: filament runout
            PAUSE
        {% elif fault == 1 %}
            M118 LLL T{tool}: forward timeout
            PAUSE
        {% endif %}
    {% endif %}
