# config/print_start_precheck.cfg
# Insert into macros/print_start.cfg in PRINT_START, directly after the
#   {% set DEBUG = params.DEBUG | default(0) | int %}
# line and before "# Reset macro variables safely".
# Tools without a buffer config are skipped automatically.

    # Buffer pre-check: stop before heating or homing if the buffer for TOOL is not ready
    {% set rkey = "filament_switch_sensor lll_t" ~ TOOL|string ~ "_runout" %}
    {% set fkey = "filament_switch_sensor lll_t" ~ TOOL|string ~ "_fault" %}
    {% if TOOL >= 0 and printer[rkey] is defined %}
        {% if not printer[rkey].filament_detected %}
            {action_raise_error("LLL T" ~ TOOL|string ~ ": no filament at buffer entrance, load filament first")}
        {% endif %}
        {% if not printer[fkey].filament_detected %}
            {action_raise_error("LLL T" ~ TOOL|string ~ ": buffer fault active, clear it first")}
        {% endif %}
    {% endif %}
